[project]
name = "pokemon-unite-meta-tiering"
version = "0.1.0"
description = "FastAPI backend for loading Pokémon Unite meta data, calculating meta scores, and generating score-based tiers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.128.8",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scikit-learn>=1.6.1",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.39.0",
]
